<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨巷灯火 · 同机位对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c171b;color:#e8efe9;font:15px system-ui;display:flex;flex-direction:column;height:100vh;height:100dvh}nav{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;flex-wrap:wrap}button,select{border:1px solid #657872;border-radius:7px;padding:7px 12px;background:#1b2a30;color:inherit;font:inherit}button[aria-pressed=true]{background:#c1d9c3;color:#152820}iframe{border:0;width:100%;flex:1}</style></head>
<body><nav aria-label="画面对比"><select aria-label="机位"><option value="aisle">中央货架</option><option value="bento">鲜食柜</option><option value="checkout">收银台</option><option value="entrance">店门口</option><option value="cooler-art">冷柜</option></select><button id="v5">V5 原版</button><button id="v6">雨巷灯火</button></nav><iframe title="便利店同机位画面" src="about:blank"></iframe>
<script>
const select=document.querySelector('select'),frame=document.querySelector('iframe');
let version='v6';
function show(){
  for(const id of ['v5','v6'])document.getElementById(id).setAttribute('aria-pressed',String(id===version));
  frame.src=(version==='v5'?'night-v5.html':'../')+'?view='+select.value+'&shot=1&quality=high';
}
for(const id of ['v5','v6'])document.getElementById(id).onclick=()=>{version=id;show();};
select.onchange=show;show();
</script></body></html>
