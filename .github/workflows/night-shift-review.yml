name: Night shift visual review
on:
  push:
    branches: [feat/night-shift-v6, feat/minamo-fusion, feat/yomachi-street-walk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, portrait]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: github.ref_name == 'feat/minamo-fusion' || github.ref_name == 'feat/yomachi-street-walk'
        with:
          ref: ${{ github.ref_name == 'feat/yomachi-street-walk' && 'efeff42943f5bb09a4a980514d99fed42c5dccf4' || '1b12c613bf4ee799b916ad369c1e5e5cf1a9c59c' }}
          path: baseline-v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          font_dir="$HOME/.local/share/fonts/night-review"
          mkdir -p "$font_dir"
          curl --fail --location --retry 2 --max-time 60 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            --output "$font_dir/NotoSansCJKsc-Regular.otf"
          fc-cache "$font_dir"
          npm install --prefix "$RUNNER_TEMP/night-qa" --no-save playwright@1.56.1
          "$RUNNER_TEMP/night-qa/node_modules/.bin/playwright" install chromium --only-shell
      - name: Capture production HTML and GLB in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/night-qa/node_modules
        run: |
          python3 -m http.server 8174 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          qa_script=tests/night-visual.cjs
          if [[ "$GITHUB_REF_NAME" == "feat/minamo-fusion" ]]; then qa_script=tests/minamo-visual.cjs; fi
          if [[ "$GITHUB_REF_NAME" == "feat/yomachi-street-walk" ]]; then qa_script=tests/street-visual.cjs; fi
          node "$qa_script" http://127.0.0.1:8174/ review-output "${{ matrix.device }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-shift-${{ matrix.device }}
          path: review-output/
          if-no-files-found: error
          retention-days: 14
