<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>雨夜便利店街角 · 微缩模型</title>
<style>
  html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse 70% 60% at 50% 40%, #2a3757 0%, #18233c 40%, #0d1425 72%, #070a13 100%);
    cursor: grab;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  body.dragging { cursor: grabbing; }
  #scene { display:block; width:100%; height:100%; outline:none; }
  #vignette {
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(0,0,0,0) 45%, rgba(3,6,14,.55) 100%);
  }
#controls { max-width:calc(100% - 24px); flex-wrap:wrap; justify-content:flex-end; position:fixed; right:20px; top:20px; display:flex; gap:10px; align-items:center; font:12px system-ui; color:#c9d4de; cursor:default; }
  button, select { background:#182535cc; color:#d5e1e8; border:1px solid #71859555; border-radius:6px; padding:8px 10px; cursor:pointer; }
  #rain-volume { width:72px; accent-color:#8bb9ac; vertical-align:middle; }
  #audio-status { position:absolute; right:0; top:100%; max-width:220px; padding-top:6px; }
  #controls label { white-space:nowrap; }
  #hint { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); color:#acbecb; font:12px/1.8 system-ui; text-align:center; pointer-events:none; transition:opacity 1s; white-space:nowrap; }
  @media(max-width:600px) { #controls { top:12px; right:12px; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="controls"><button id="rain-audio" type="button" aria-pressed="false">雨声：关</button><label>音量 <input id="rain-volume" type="range" min="0" max="100" value="35" aria-label="雨声音量" aria-valuetext="35%"></label><span id="audio-status" role="status"></span><button id="reset-view" type="button">重置视角</button><label>画质 <select id="quality"><option value="high">高</option><option value="low">流畅</option></select></label></div>
<p id="hint">拖动旋转 · 滚轮缩放 · 右键平移<br>触屏单指旋转 · 双指缩放</p>

<script src="vendor/three.min.js"></script>
<script src="src/core.js"></script>
<script src="src/textures.js"></script>
<script src="src/layout.js"></script>
<script src="src/base.js"></script>
<script src="src/store.js"></script>
<script src="src/interior.js"></script>
<script src="src/street.js"></script>
<script src="src/buildings.js"></script>
<script src="src/details.js"></script>
<script src="src/people.js"></script>
<script src="src/effects.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
